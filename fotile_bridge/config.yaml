name: Fotile Local Bridge
version: "0.1.0"
slug: fotile_bridge
description: 把方太智能家电从厂商云接管到本地 Home Assistant（HTTP 最小云 + 本地 MQTT）
url: https://github.com/yourname/fotile-local-bridge
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
startup: application
boot: auto
options:
  http_port: 8088
  mqtt_port: 1883
  advertise_host: ""
  upstream_ip: "101.37.40.179"
  learn_mode: true
  ha_mqtt_host: ""
  ha_mqtt_port: 1883
  ha_mqtt_user: ""
  ha_mqtt_password: ""
  log_level: info
schema:
  http_port: port
  mqtt_port: port
  advertise_host: str
  upstream_ip: str
  learn_mode: bool
  ha_mqtt_host: str
  ha_mqtt_port: port
  ha_mqtt_user: str
  ha_mqtt_password: password
  log_level: list(debug|info|warning|error)
