name: Fotile Local Bridge
version: "0.5.0"
slug: fotile_bridge
description: 把方太智能家电从厂商云接管到本地 Home Assistant（HTTP 最小云 + 本地 MQTT）
url: https://github.com/zzliux/fotile-local-bridge
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
startup: application
boot: auto
options:
  http_port: 8088
  mqtt_port: 1883
  advertise_host: ""
  upstream_ip: "101.37.40.179"
  learn_mode: true
  ha_mqtt_host: ""
  ha_mqtt_port: 1883
  ha_mqtt_user: ""
  ha_mqtt_password: ""
  log_level: info
  mirror_enabled: false
  mirror_broker: "121.41.80.81"
  mirror_broker_port: 1883
  mirror_device_id: "1149539722"
  mirror_product_id: "1032A"
  mirror_password: ""
  relay_enabled: false
  relay_port: 1886
  relay_upstream: "121.41.80.81"
schema:
  http_port: port
  mqtt_port: port
  advertise_host: str
  upstream_ip: str
  learn_mode: bool
  ha_mqtt_host: str
  ha_mqtt_port: port
  ha_mqtt_user: str
  ha_mqtt_password: password
  log_level: list(debug|info|warning|error)
  mirror_enabled: bool
  mirror_broker: str
  mirror_broker_port: port
  mirror_device_id: str
  mirror_product_id: str
  mirror_password: password
  relay_enabled: bool
  relay_port: port
  relay_upstream: str
